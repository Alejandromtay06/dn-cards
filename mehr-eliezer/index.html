<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500;125,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#F0E7E0; --panel:#FFFFFF; --ink:#0E1014; --muted:rgba(14,16,20,.62);
    --brand:#263E56; --brand-hover:#1E232B; --on-brand:#F8F3F0; --rule:rgba(14,16,20,.14); --focus:#3B5D7F;
    --display:"Aeonik Pro Extended","Archivo","Helvetica Neue",Arial,sans-serif;
    --sans:"Aeonik Pro","Inter","Helvetica Neue",Arial,sans-serif;
    --mono:"Aeonik Mono","JetBrains Mono",ui-monospace,monospace;
    --ease:cubic-bezier(.2,0,0,1); --fast:160ms;
  }
  .name{font-family:var(--display); font-variation-settings:"wdth" 125; font-weight:500; letter-spacing:-.02em; font-size:30px}
  .logo{height:40px}

  *{box-sizing:border-box; margin:0; padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--page); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh}
  a{color:inherit; text-decoration:none}
  :where(a,button,[tabindex]):focus-visible{outline:2px solid var(--focus); outline-offset:2px}
  .card{max-width:430px; margin:0 auto; min-height:100vh; background:var(--panel); display:flex; flex-direction:column}
  @media (min-width:480px){ body{padding:40px 0} .card{min-height:0; border:1px solid var(--rule); border-radius:28px; overflow:hidden} }

  .hero{position:relative; aspect-ratio:1/1; max-height:460px; background:var(--brand); overflow:hidden}
  .hero img{display:block; width:100%; height:100%; object-fit:cover; object-position:50% 25%}
  .hero .fallback{position:absolute; inset:0; display:grid; place-items:center; padding:24%}
  .hero .fallback img{width:100%; height:auto; object-fit:contain}

  .panel{padding:20px 24px 28px; display:flex; flex-direction:column; flex:1}
  .head{display:flex; justify-content:flex-end; min-height:40px}
  .logo{display:block; width:auto}
  .who{margin-top:14px}
  .name{color:var(--ink); line-height:1.1}
  .title{margin-top:10px; font-size:16px; color:var(--muted); line-height:1.45}
  .org{font-size:16px; color:var(--muted); line-height:1.45}

  .rows{list-style:none; margin-top:22px; display:flex; flex-direction:column; gap:6px}
  .row{display:flex; align-items:center; gap:16px; padding:8px 0; min-height:60px; transition:opacity var(--fast) var(--ease)}
  .row:hover{opacity:.78}
  .ico{flex:none; width:52px; height:52px; border-radius:50%; background:var(--brand); color:var(--on-brand); display:grid; place-items:center}
  .txt{min-width:0}
  .v{display:block; font-size:17px; color:var(--ink); overflow-wrap:anywhere; line-height:1.3}
  .k{display:block; font-size:13px; color:var(--muted); margin-top:2px}

  .actions{margin-top:24px; display:grid; grid-template-columns:1fr 52px; gap:10px; align-items:stretch}
  .btn{display:flex; align-items:center; justify-content:center; gap:10px; background:var(--brand); color:var(--on-brand); padding:16px 20px; border-radius:12px; font-size:16px; font-weight:500; min-height:52px; transition:background var(--fast) var(--ease)}
  .btn:hover{background:var(--brand-hover)}
  .share{width:52px; min-height:52px; border-radius:12px; border:1px solid var(--brand); background:transparent; color:var(--brand); display:grid; place-items:center; cursor:pointer; transition:background var(--fast) var(--ease)}
  .share:hover{background:var(--page)}
  .note{margin-top:12px; font-size:13px; color:var(--muted); text-align:center; line-height:1.5}

  .tag{margin-top:26px; font-size:12px; color:var(--muted); text-align:center}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<main class="card">
  <figure class="hero"><div class="fallback"><img src="../assets/dni-lockup-light.png" alt=""></div></figure>
  <section class="panel">
    <div class="head"><img class="logo" src="../assets/dni-lockup-dark.png" alt="Diamond National Investments"></div>
    <div class="who">
      <h1 class="name">Mehr Eliezer</h1>
      <p class="title">Marketing Director</p>
      <p class="org">Diamond National Investments</p>
    </div>
    <ul class="rows">
<li><a class="row" href="https://wa.me/50768227290" target="_blank" rel="noopener"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 20l1-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg></span><span class="txt"><span class="v">+507 6822-7290</span><span class="k">WhatsApp</span></span></a></li>
<li><a class="row" href="mailto:meliezer@dn-investments.com"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7.5 9 6 9-6"/></svg></span><span class="txt"><span class="v">meliezer@dn-investments.com</span><span class="k">Work</span></span></a></li>
<li><a class="row" href="https://www.linkedin.com/in/mehreliezer" target="_blank" rel="noopener"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><text x="12" y="16.6" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="13.5" fill="currentColor" stroke="none">in</text></svg></span><span class="txt"><span class="v">in/mehreliezer</span><span class="k">LinkedIn</span></span></a></li>
<li><a class="row" href="https://dn-investments.com" target="_blank" rel="noopener"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><span class="txt"><span class="v">dn-investments.com</span><span class="k">Website</span></span></a></li>
    </ul>
    <div class="actions">
      <a class="btn" href="mehr-eliezer.vcf" download="mehr-eliezer.vcf"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0M18 8v6M15 11h6"/></svg>Save contact</a>
      <button class="share" id="share" type="button" aria-label="Share this card"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.6M8.2 13.2l7.6 4.6"/></svg></button>
    </div>
    <p class="note" id="scan">Saves name, phone, email, LinkedIn and website to your contacts.</p>
    <p class="tag">Bold ventures. Balanced returns.</p>
  </section>
</main>
<script>(function(){
  var b=document.getElementById('share'), note=document.getElementById('scan'); if(!b) return;
  var url=location.href.split('#')[0], title=document.title, orig=note?note.innerHTML:'';
  function done(){ if(!note) return; note.textContent='Link copied'; setTimeout(function(){ note.innerHTML=orig; },2200); }
  b.addEventListener('click', function(){
    if(navigator.share){ navigator.share({title:title,url:url}).catch(function(){}); return; }
    if(navigator.clipboard){ navigator.clipboard.writeText(url).then(done, function(){ prompt('Copy this link', url); }); }
    else { prompt('Copy this link', url); }
  });
})();</script>
</body>
</html>
